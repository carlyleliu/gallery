site_name: Carlyle's画廊
site_url: https://carlyleliu.github.io/gallery/
copyright: Copyright © 2026 Carlyle

theme:
  name: material
  language: zh
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  font: false # 字体由 extra.css 中的 @font-face 提供
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 日间模式
  features:
    - navigation.instant

plugins:
  - search:
      lang: zh
  - glightbox:
      skip_classes:
        - no-glb

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lazyload.iife.min.js
  - javascripts/after.min.js
