site_name: Carlyle's画廊
site_url: https://carlyleliu.github.io/gallery/
copyright: Copyright © 2026 Carlyle

theme:
  name: material
  language: zh
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  font: false # 字体由 extra.css 中的 @font-face 提供
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 日间模式
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.tabs

nav:
  - 首页: index.md
  - 旅游:
    - 旅游/index.md
    - 徒步:
      - 旅游/徒步/index.md
      - 云南: 旅游/徒步/云南/index.md
      - 桂林: 旅游/徒步/桂林/index.md
      - 稻城: 旅游/徒步/稻城/index.md
    - 风景:
      - 旅游/风景/index.md
      - 海岛: 旅游/风景/海岛/index.md
  - 扫街: 扫街/index.md
  - 视频: 视频/index.md
  - 地图: map.md

plugins:
  - search:
      lang: zh
  - glightbox:
      skip_classes:
        - no-glb

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - javascripts/lazyload.iife.min.js
  - javascripts/after.min.js
  - javascripts/map.js
